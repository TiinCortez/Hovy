name: Deploy Producción (hovyapp.com.ar)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test_and_deploy:
    name: Build & Deploy to Production VM
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar dependencias y build del Cliente
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Validar sintaxis y pruebas del Backend
        working-directory: server
        run: |
          npm ci
          for f in $(find src -name '*.js'); do
            node --check "$f"
          done
          node --test src/test/*.test.mjs

      - name: Desplegar en Azure VM (Producción - Puerto 4000)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/Hovy-prod
            git fetch origin main
            git reset --hard origin/main
            
            # Forzar variables de compilación de Producción para Vite en el cliente
            export VITE_SUPABASE_URL="https://dulaaxavsvgkqqbrvltd.supabase.co"
            docker compose up -d --build --force-recreate
            docker image prune -f

            echo "Verificando estado de salud del servicio en Producción..."
            EXITO=0
            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1:4000/api/health > /dev/null; then
                echo "Smoke test exitoso en el intento $i/12."
                EXITO=1
                break
              fi
              echo "Esperando que el contenedor responda ($i/12)..."
              sleep 5
            done

            if [ $EXITO -ne 1 ]; then
              echo "ERROR: El healthcheck fallo tras 60 segundos."
              docker compose logs --tail 50
              exit 1
            fi
