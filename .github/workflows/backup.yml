name: Backup Semanal de Base de Datos y Configuración

on:
  schedule:
    # Todos los domingos a las 03:00 AM UTC (00:00 AM hora Argentina)
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: backup-semanal
  cancel-in-progress: false

jobs:
  backup:
    name: Ejecutar Backup de Configuración y Base de Datos (HTTPS Free Tier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Backup en Azure VM (Configuración + Volcado Lógico HTTPS de Producción)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            BACKUP_DIR="/home/azureuser/backups"
            FECHA=$(date +%Y%m%d_%H%M%S)
            mkdir -p "$BACKUP_DIR"

            echo "=== 1. Respaldando archivos de configuración y esquemas SQL ($FECHA) ==="
            tar -czf "$BACKUP_DIR/hovy_backup_$FECHA.tar.gz" \
              /home/azureuser/Hovy-prod/docs/migrations \
              /home/azureuser/Hovy-prod/docker-compose.yml \
              /etc/nginx/sites-available \
              2>/dev/null || true

            echo "=== 2. Exportando datos y esquema de Supabase Producción vía HTTPS (Free Tier) ==="
            if docker ps --format '{{.Names}}' | grep -q '^hovy-api-prod$'; then
              if docker exec hovy-api-prod test -f /app/scripts/db-backup-https.mjs; then
                docker exec hovy-api-prod node /app/scripts/db-backup-https.mjs /tmp/supabase_prod_https.json.gz
                docker cp hovy-api-prod:/tmp/supabase_prod_https.json.gz "$BACKUP_DIR/supabase_prod_${FECHA}.json.gz"
                docker exec hovy-api-prod rm -f /tmp/supabase_prod_https.json.gz
              else
                echo "ℹ️  El contenedor hovy-api-prod aún no incluye scripts/db-backup-https.mjs (se activará en el próximo merge a main)."
              fi
            fi

            # Rotación de retención: conservar únicamente los últimos 8 backups en la VM
            ls -1t "$BACKUP_DIR"/hovy_backup_*.tar.gz 2>/dev/null | tail -n +9 | xargs -r rm -f
            ls -1t "$BACKUP_DIR"/supabase_prod_*.json.gz 2>/dev/null | tail -n +9 | xargs -r rm -f
            ls -1t "$BACKUP_DIR"/pre_deploy_prod_*.json.gz 2>/dev/null | tail -n +9 | xargs -r rm -f

            echo "=== Backups disponibles en $BACKUP_DIR ==="
            ls -lh "$BACKUP_DIR"
