name: Deploy Staging (dev.hovyapp.com.ar)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test_and_deploy:
    name: Build & Deploy to Staging VM
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar dependencias y build del Cliente
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Validar sintaxis y pruebas del Backend
        working-directory: server
        run: |
          npm ci
          for f in $(find src -name '*.js'); do
            node --check "$f"
          done
          node --test src/test/*.test.mjs

      - name: Desplegar en Azure VM (Staging - Puerto 4001)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/Hovy-dev
            git fetch origin develop
            git reset --hard origin/develop
            docker compose up -d --build --force-recreate
            docker image prune -f

            echo "Verificando estado de salud del servicio en Staging..."
            EXITO=0
            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1:4001/api/health > /dev/null; then
                echo "Smoke test exitoso en el intento $i/12."
                EXITO=1
                break
              fi
              echo "Esperando que el contenedor responda ($i/12)..."
              sleep 5
            done

            if [ $EXITO -ne 1 ]; then
              echo "ERROR: El healthcheck fallo tras 60 segundos."
              docker compose logs --tail 50
              exit 1
            fi
