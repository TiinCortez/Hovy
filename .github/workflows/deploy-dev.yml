name: Deploy Desarrollo / Staging (dev.hovyapp.com.ar)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test_and_deploy:
    name: Build & Deploy to Staging VM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar correlatividad de migraciones SQL
        run: node scripts/verify-migrations.mjs

      - name: Validar dependencias y build del Cliente
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Validar sintaxis y pruebas del Backend
        working-directory: server
        env:
          NODE_ENV: test
          SUPABASE_URL: https://ci-tests.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-tests-sin-conexion
          JWT_SECRET: ci-test-jwt-secret-key-min-32-chars
        run: |
          npm ci
          for f in $(find src -name '*.js'); do
            node --check "$f"
          done
          node --test src/test/*.test.mjs

      - name: Desplegar, Migrar BD y Verificar Salud en Azure VM (Staging - Puerto 4001)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/Hovy-dev
            PREV_SHA=$(git rev-parse HEAD)
            git fetch origin develop
            git reset --hard origin/develop

            export VITE_SUPABASE_URL="https://kzfziqdmtvrcwotemvyj.supabase.co"
            export GIT_SHA=$(git rev-parse --short HEAD)
            docker compose up -d --build --force-recreate
            docker image prune -f

            echo "Ejecutando migraciones automáticas pendientes en Staging..."
            docker compose exec -T api node scripts/db-migrate.mjs --apply

            echo "Verificando estado de salud del servicio en Staging (GIT_SHA=$GIT_SHA)..."
            EXITO=0
            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1:4001/api/health > /dev/null; then
                echo "Smoke test exitoso en el intento $i/12."
                curl -s http://127.0.0.1:4001/api/health?deep=true || true
                echo ""
                EXITO=1
                break
              fi
              echo "Esperando que el contenedor responda ($i/12)..."
              sleep 5
            done

            if [ $EXITO -ne 1 ]; then
              echo "ERROR: El healthcheck falló tras 60s. Ejecutando AUTO-ROLLBACK hacia $PREV_SHA..."
              docker compose logs --tail 50
              git reset --hard "$PREV_SHA"
              export GIT_SHA=$(git rev-parse --short HEAD)
              docker compose up -d --build --force-recreate
              exit 1
            fi
