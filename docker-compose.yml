services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://kzfziqdmtvrcwotemvyj.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-sb_publishable_6iEe3FDH5iTXQqRou3E4qQ_1DFCACJd}
        GIT_SHA: ${GIT_SHA:-local-dev}
    container_name: ${CONTAINER_NAME:-hovy-api}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-4000}:4000"
    environment:
      - GIT_SHA=${GIT_SHA:-local-dev}
    env_file:
      - ./server/.env
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
