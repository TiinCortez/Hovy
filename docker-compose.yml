services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hovy-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
